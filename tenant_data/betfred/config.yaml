tenant_id: betfred
name: Betfred Data Platform
deployment_mode: multi_tenant
git:
  provider: bitbucket
  repository: sharpgaming/data-platform-glue-etl-transactional-data-jobs
  branch_strategy:
    feature_prefix: feature/
    development_branch: dev
    production_branch: main
    deploy_from_feature: true
    require_pr_for_prod: true
    merge_target: main
cloud:
  provider: aws
  region: eu-west-2
  environments: [dev, test, prod]
  credentials_secret: tenant_data/betfred/secrets.local.yaml
workflow:
  default_template: dev_to_prod
skills:
  include_standard: true
  allow_overrides: true
rules:
  enforce_prod_destructive_guard: true
memory:
  backend: sqlite
security:
  require_human_approval_for:
    - prod_deploy
    - destructive_sql
    - iam_change
    - gold_drop
notifications:
  channels: [in_app]
  slack_enabled: false
  teams_enabled: false
storage:
  backend: filesystem
